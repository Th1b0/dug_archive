<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111613">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Intelligence Archive home">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span><strong>INTELLIGENCE</strong><small>ARCHIVE / FIELD RECORDS</small></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
        <a {% if page.url contains '/reports' or page.layout == 'report' %}aria-current="page"{% endif %} href="{{ '/reports/' | relative_url }}">All reports</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>INTELLIGENCE ARCHIVE</span>
      <span>Private roleplay records · Static archive</span>
    </div>
  </footer>
</body>
</html>
