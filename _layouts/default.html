<!doctype html>
<html lang="en">
<head>
  

<script>
(() => {
  const PASSWORD = "14Cf_4}k%%V{";
  const STORAGE_KEY = "intelligence_archive_authenticated";

  const params = new URLSearchParams(window.location.search);
  const isSharedReport =
    window.location.pathname.includes("/reports/") &&
    params.get("view") === "shared";

  if (isSharedReport) {
    document.documentElement.classList.add("shared-read-only");
    return;
  }

  if (localStorage.getItem(STORAGE_KEY) === "true") {
    return;
  }

  function showPasswordPrompt() {
    while (localStorage.getItem(STORAGE_KEY) !== "true") {
      const entered = prompt(
        "Intelligence Archive — Enter password:"
      );

      if (entered === null) {
        document.documentElement.innerHTML = `
          <head>
            <title>Access denied</title>
          </head>
          <body style="
            background:#23252b;
            color:#e2e5eb;
            font:16px sans-serif;
            padding:40px
          ">
            <h1>Access denied</h1>
            <p>A password is required to view this archive.</p>
            <button onclick="location.reload()">Try again</button>
          </body>`;
        return;
      }

      if (entered === PASSWORD) {
        localStorage.setItem(STORAGE_KEY, "true");
        return;
      }

      alert("Incorrect password.");
    }
  }

  showPasswordPrompt();
})();
</script>


  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ee">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Intelligence Archive home">
        <span><strong>INTELLIGENCE</strong><small>ARCHIVE / FIELD RECORDS</small></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
        <a {% if page.url contains '/reports' or page.layout == 'report' %}aria-current="page"{% endif %} href="{{ '/reports/' | relative_url }}">All reports</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Report ARCHIVE</span>
      <span>Tybo's reports</span>
    </div>
  </footer>
  
</body>
</html>
