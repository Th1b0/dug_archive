title: Intelligence Archive
description: Field reports and intelligence records
url: " https://th1b0.github.io/"
baseurl: "/dug_archive"
markdown: kramdown
kramdown:
  input: GFM
permalink: pretty

collections:
  reports:
    output: true
    permalink: /reports/:name/

defaults:
  - scope:
      path: ""
      type: reports
    values:
      layout: report

exclude:
  - README.md
  - LICENSE
